<svg xmlns="http://www.w3.org/2000/svg" id="mesh-gradient" width="2560" height="1280" viewBox="0 0 2560 1280" >
 <defs>
  <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="2560" height="1280">
   <feGaussianBlur stdDeviation="100" />
  </filter>
  <filter id="noise" x="0" y="0" width="100%" height="100%">
   <feTurbulence type="fractalNoise" baseFrequency="1" octaves="3" result="turbulence" stitchTiles="stitch" />
   <feBlend in="SourceGraphic" in2="turbulence" mode="overlay" />
  </filter>
 </defs>
 <rect id="background" width="100%" height="100%" fill="#030303" />
 <g id="swatches" width="2560" height="1280" filter="url(#blur)"></g>
 <rect x="0" y="0" width="2560" height="1280" style="mix-blend-mode: luminosity; filter: url(#noise); opacity: 20%"></rect>
</svg>

